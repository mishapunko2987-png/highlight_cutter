name: highlight_cutter
description: "Автоматический выбор лучших моментов фильма и нарезка клипов."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  highlight_cutter_native:
    path: ./native
  file_picker: ^8.0.0
  video_player: ^2.8.7
  path_provider: ^2.1.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
